        let score = 0;
        let totalPreguntas = 0;

        // Cargar y procesar el archivo Markdown local
        async function cargarPrueba() {
            try {
                const response = await fetch('SimulacroConcurso_.md');
                if (!response.ok) throw new Error('No se encontró el archivo');
                const text = await response.text();
                procesarTexto(text);
            } catch (error) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded">
                        <p class="font-bold">Error al cargar el archivo</p>
                        <p>Asegúrate de estar corriendo esto en un servidor local (ej. Live Server) y que tu archivo se llame exactamente <b>SimulacroConcurso_.md</b> y esté en la misma ruta.</p>
                    </div>
                `;
            }
        }

        function procesarTexto(text) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 
            
            // Separar la prueba en la parte funcional y comportamental
            const partes = text.split('EXAMEN COMPORTAMENTAL');
            const funcionales = partes[0];
            const comportamentales = partes[1];

            // 1. PROCESAR FUNCIONALES
            const bloquesCasos = funcionales.split(/Caso \d+:/).slice(1);
            
            bloquesCasos.forEach((bloque, index) => {
                const numeroCaso = index + 1;
                
                // Separar la descripción del caso de las preguntas
                const separacionProblemas = bloque.split(/Problema \d+:/);
                const descripcionCaso = separacionProblemas[0].trim();
                
                const divCaso = document.createElement('div');
                divCaso.className = 'bg-slate-200 p-6 rounded-xl border-l-4 border-blue-600 shadow-sm';
                divCaso.innerHTML = `<h2 class="text-xl font-bold text-slate-800 mb-3">Caso ${numeroCaso}</h2>
                                     <p class="text-slate-700 whitespace-pre-line">${descripcionCaso}</p>`;
                
                container.appendChild(divCaso);

                // Procesar cada problema dentro del caso
                const problemas = separacionProblemas.slice(1);
                problemas.forEach((probTexto) => {
                    const matchOpciones = probTexto.match(/(.*?)(A\).*?)(B\).*?)(C\).*?)(?=Respuesta:|$)/s);
                    
                    if (matchOpciones) {
                        totalPreguntas++;
                        const preguntaTexto = matchOpciones[1].trim();
                        const opA = matchOpciones[2].replace(/^A\)/, '').trim();
                        const opB = matchOpciones[3].replace(/^B\)/, '').trim();
                        const opC = matchOpciones[4].replace(/^C\)/, '').trim();
                        const probId = totalPreguntas; // Consecutivo de problemas

                        const divProb = document.createElement('div');
                        divProb.className = 'bg-white p-6 rounded-xl border-2 border-transparent shadow-sm question-card transition-colors duration-300';
                        divProb.id = `q-${probId}`;
                        
                        divProb.innerHTML = `
                            <p class="font-bold text-slate-800 mb-4">Problema ${probId}: ${preguntaTexto}</p>
                            <div class="space-y-3">
                                <label class="block p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                                    <input type="radio" name="func-${probId}" value="A" class="mr-2"> <strong>A)</strong> ${opA}
                                </label>
                                <label class="block p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                                    <input type="radio" name="func-${probId}" value="B" class="mr-2"> <strong>B)</strong> ${opB}
                                </label>
                                <label class="block p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                                    <input type="radio" name="func-${probId}" value="C" class="mr-2"> <strong>C)</strong> ${opC}
                                </label>
                            </div>
                            <button onclick="calificar(${probId})" class="mt-5 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">
                                Calificar
                            </button>
                            <div id="exp-${probId}" class="hidden mt-4 p-4 rounded-lg text-sm font-medium"></div>
                        `;
                        container.appendChild(divProb);
                    }
                });
            });

            // Actualizar marcador
            document.getElementById('total').innerText = totalPreguntas;

            // 2. PROCESAR COMPORTAMENTALES
            if (comportamentales) {
                const divComportamental = document.createElement('div');
                divComportamental.className = 'bg-slate-800 text-white p-6 rounded-xl shadow-sm mt-12';
                divComportamental.innerHTML = `<h2 class="text-2xl font-bold mb-2">Examen Comportamental</h2>
                                               <p class="text-slate-300 text-sm">Estas preguntas no suman al puntaje funcional, son de autoevaluación.</p>`;
                container.appendChild(divComportamental);

                const preguntasComp = comportamentales.split(/\n\d+\.\s/).slice(1);
                preguntasComp.forEach((pregTexto, index) => {
                    const num = index + 1;
                    const pregLimpia = pregTexto.split('Totalmente en desacuerdo')[0].trim();
                    
                    const divComp = document.createElement('div');
                    divComp.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm mt-4 text-slate-800';
                    divComp.innerHTML = `
                        <p class="font-bold mb-4">${num}. ${pregLimpia}</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                            <label class="p-3 border rounded-lg text-center hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="comp-${num}" value="1" class="mb-2 block mx-auto"> T. en desacuerdo
                            </label>
                            <label class="p-3 border rounded-lg text-center hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="comp-${num}" value="2" class="mb-2 block mx-auto"> En desacuerdo
                            </label>
                            <label class="p-3 border rounded-lg text-center hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="comp-${num}" value="3" class="mb-2 block mx-auto"> De acuerdo
                            </label>
                            <label class="p-3 border rounded-lg text-center hover:bg-slate-50 cursor-pointer transition">
                                <input type="radio" name="comp-${num}" value="4" class="mb-2 block mx-auto"> T. de acuerdo
                            </label>
                        </div>
                    `;
                    container.appendChild(divComp);
                });
            }
        }

        // Lógica de calificación interactiva
        function calificar(id) {
            const radios = document.getElementsByName(`func-${id}`);
            let seleccion = null;
            for (let r of radios) {
                if (r.checked) seleccion = r.value;
            }

            if (!seleccion) {
                alert("Selecciona una opción primero para poder calificar.");
                return;
            }

            const data = diccionarioRespuestas[id];
            const card = document.getElementById(`q-${id}`);
            const expDiv = document.getElementById(`exp-${id}`);

            if (!data) {
                alert("Aún no has configurado la respuesta correcta para el Problema " + id + " en el diccionario de código.");
                return;
            }

            expDiv.classList.remove('hidden');
            expDiv.innerText = data.exp;
            card.classList.remove('correct', 'incorrect'); // Reset de colores

            if (seleccion === data.correct) {
                card.classList.add('correct');
                expDiv.className = 'mt-4 p-4 rounded-lg text-sm font-medium bg-green-50 text-green-800 border border-green-200';
                
                if (!card.dataset.acertada) {
                    card.dataset.acertada = "true";
                    score++;
                    document.getElementById('score').innerText = score;
                }
            } else {
                card.classList.add('incorrect');
                expDiv.className = 'mt-4 p-4 rounded-lg text-sm font-medium bg-red-50 text-red-800 border border-red-200';
                
                if (card.dataset.acertada === "true") {
                    delete card.dataset.acertada;
                    score--;
                    document.getElementById('score').innerText = score;
                }
            }
        }

        // Iniciar el parser al cargar la ventana
        window.onload = cargarPrueba;
    </script>
</body>
</html>
